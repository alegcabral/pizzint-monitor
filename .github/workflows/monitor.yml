name: Monitor PizzINT

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pizzint-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Verificar o PizzINT
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 monitor.py

      - name: Salvar estado
        run: |
          git config user.name "pizzint-monitor"
          git config user.email "pizzint-monitor@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "atualiza estado" && git push)
